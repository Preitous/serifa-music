roxo_hover = "#3b3049"
roxo_pressed = "#40354f"
roxo_borda = "#51445f"
roxo_borda_claro = "#71617f"
roxo_escuro = "#66547f"
cinza_texto = "#665b70"
cinza_claro = "#77717f"
roxo_muito_claro = "#c9bdd5"
rosa_alerta = "#e58b91"


