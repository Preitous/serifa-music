# ============================================================
# PALETA DE CORES — SERIFA MUSIC
# ============================================================
# Edite os valores HEX para personalizar o aplicativo.
# Formatos aceitos: #RRGGBB e #AARRGGBB.
#
# DICA:
# Altere uma cor por vez e mantenha uma cópia dos valores
# originais para poder retornar à aparência padrão.
#
# Estas cores são tokens de tema. Cores extraídas de capas
# de álbuns e imagens continuam sendo geradas dinamicamente.

[fundo]
principal = "#17151e"             # Fundo geral da janela
lateral = "#211e2a"               # Barra lateral
superficie = "#1b1823"            # Fundo de áreas e cartões
superficie_elevada = "#302a3b"    # Painéis e elementos elevados
sombra = "#100e15"                # Sombras profundas

[texto]
principal = "#f3edf9"             # Texto principal
secundario = "#bdb3c9"            # Texto secundário
discreto = "#95899f"              # Legendas e informações discretas
desabilitado = "#81798b"          # Texto de controles desabilitados
branco = "#ffffff"                # Branco puro
lavanda = "#e9d5ff"               # Texto com destaque suave
lavanda_clara = "#f2eafa"         # Variação clara de texto
lavanda_alternativa = "#f2edf7"   # Variação alternativa de texto
texto_apoio = "#a49bad"           # Textos auxiliares

[destaque]
primario = "#72558d"              # Roxo principal do tema
secundario = "#d9b6ff"            # Roxo claro para destaques
hover = "#493e58"                 # Fundo de destaque ao passar o mouse
roxo_botoes = "#49375f"           # Roxo usado em botões e seleções
roxo_medio = "#59496b"            # Roxo intermediário
roxo_claro = "#c9a7ef"            # Roxo claro para ícones e textos
roxo_suave = "#b58ae0"             # Roxo suave de detalhes

[verde]
ativo = "#b6f23a"                 # Verde principal de ações ativas
hover = "#c8ff4a"                 # Verde claro ao passar o mouse
alternativo = "#a2d92a"           # Verde alternativo de componentes

[borda]
discreta = "#393243"              # Bordas discretas
forte = "#493e58"                 # Bordas mais visíveis
roxa = "#59496b"                  # Bordas com tom roxo
controle = "#51495c"               # Bordas e trilhos de controles

[estado]
favorito = "#d9b6ff"              # Cor de favoritos
sucesso = "#76c9b9"               # Estado positivo
aviso = "#ea6846"                 # Avisos e alertas
erro = "#ea6846"                  # Erros e estados críticos

[qt]
janela = "#17151e"                # Fundo da janela Qt
texto_janela = "#f3edf9"          # Texto padrão da janela
base = "#1b1823"                  # Fundo de campos e áreas de edição
base_alternada = "#211e2a"        # Fundo alternado
tooltip_background = "#211e2a"   # Fundo das dicas de ferramentas
tooltip_border = "#ffffff"       # Contorno das dicas de ferramentas
tooltip_text = "#ffffff"         # Texto das dicas de ferramentas
texto = "#f3edf9"                 # Texto padrão dos controles
botao = "#302a3b"                 # Fundo padrão de botões
texto_botao = "#e9d5ff"           # Texto padrão de botões
texto_brilhante = "#ffffff"       # Texto de alto contraste
selecao = "#72558d"               # Seleção padrão
texto_selecao = "#ffffff"         # Texto sobre seleção
luz = "#493e58"                   # Tom claro da paleta Qt
meio_claro = "#393243"            # Tom intermediário claro
meio = "#302a3b"                  # Tom intermediário
escuro = "#17151e"                # Tom escuro
sombra = "#100e15"                # Sombra da paleta Qt
texto_espaco_reservado = "#95899f" # Texto de placeholder
texto_desabilitado = "#81798b"    # Texto desabilitado
selecao_desabilitada = "#493e58"  # Fundo de seleção desabilitada
texto_selecao_desabilitada = "#aaa3b6" # Texto de seleção desabilitada

[auxiliar]
lavanda_escura = "#c8bfd2"        # Detalhes claros auxiliares
roxo_controle = "#ad83d5"         # Detalhes de controles e sliders
roxo_controle_claro = "#e4d0f5"   # Alças e indicadores de controles
cinza_controle = "#51495c"        # Trilhos de controles


[componentes]
fundo_intermediario = "#25212e"
fundo_alternativo = "#272330"
fundo_cartao = "#292433"
fundo_cartao_alternativo = "#292532"
fundo_painel = "#2b2735"
